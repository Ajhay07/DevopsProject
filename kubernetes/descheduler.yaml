# Optional Integration: Kubernetes Descheduler
# Strategy: LowNodeUtilization
# Note: Descheduler bases its decisions primarily on resource requests vs capacity,
# whereas ClusterBalancer uses real-time live CPU and memory metrics from Metrics Server.
apiVersion: v1
kind: ConfigMap
metadata:
  name: descheduler-policy-config
  namespace: kube-system
data:
  policy.yaml: |
    apiVersion: "descheduler/v1alpha2"
    kind: "DeschedulerPolicy"
    profiles:
      - name: default
        pluginConfig:
          - name: "DefaultEvictor"
            args:
              evictLocalStoragePods: true
              ignorePvcPods: false
          - name: "LowNodeUtilization"
            args:
              thresholds:
                "cpu": 30
                "memory": 30
                "pods": 30
              targetThresholds:
                "cpu": 75
                "memory": 80
                "pods": 80
        plugins:
          balance:
            enabled:
              - "LowNodeUtilization"
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: descheduler-cronjob
  namespace: kube-system
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: "Forbid"
  jobTemplate:
    spec:
      template:
        metadata:
          name: descheduler-pod
        spec:
          priorityClassName: system-cluster-critical
          serviceAccountName: descheduler-sa
          containers:
            - name: descheduler
              image: registry.k8s.io/descheduler/descheduler:v0.31.0
              imagePullPolicy: IfNotPresent
              command:
                - "/bin/descheduler"
              args:
                - "--policy-config-file=/policy-dir/policy.yaml"
                - "--v=3"
              volumeMounts:
                - mountPath: /policy-dir
                  name: policy-volume
          restartPolicy: "OnFailure"
          volumes:
            - name: policy-volume
              configMap:
                name: descheduler-policy-config
