apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-stress
  namespace: default
  labels:
    app: cpu-stress
    managed-by: clusterbalancer
spec:
  replicas: 6
  selector:
    matchLabels:
      app: cpu-stress
  template:
    metadata:
      labels:
        app: cpu-stress
    spec:
      containers:
      - name: stress
        image: polinux/stress
        command: ["stress"]
        args: ["--cpu", "2", "--timeout", "3600s"]
        resources:
          requests:
            cpu: "150m"
            memory: "64Mi"
          limits:
            cpu: "400m"
            memory: "128Mi"
      restartPolicy: Always
